# Workflow for deploying BoredClicker to GitHub Pages
name: Deploy BoredClicker to Pages

on:
  push:
    branches: ["BoredClicker"]  # change if your branch is different
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ github.event.repository.html_url }}/pages  # optional: replace if you have a Pages URL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'   # uploads your repository root, adjust if your BoredClicker files are in a subfolder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
